name: Generate bilingual resume PDFs
on:
  push:
    branches:
      - feat/product-engineering-resume-2026
    paths:
      - 'curriculo.html'
      - 'index.css'
      - '.github/workflows/resume-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render printable pages
        run: |
          python3 -m http.server 8765 >/tmp/resume-server.log 2>&1 &
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless: true});
            for (const lang of ['pt', 'en']) {
              const page = await browser.newPage();
              await page.goto('http://127.0.0.1:8765/curriculo.html?lang=' + lang, {waitUntil:'networkidle'});
              await page.evaluate(() => {
                document.documentElement.setAttribute('data-theme', 'light');
                setFontSize(100);
              });
              await page.pdf({
                path: 'curriculo-moises-filho-' + lang + '.pdf',
                format: 'A4', printBackground: true,
                margin: {top: '10mm', right: '10mm', bottom: '10mm', left: '10mm'},
                preferCSSPageSize: true
              });
              await page.close();
            }
            await browser.close();
          })().catch(e => {console.error(e); process.exit(1)});
          NODE
      - name: Commit PDF updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculo-moises-filho-pt.pdf curriculo-moises-filho-en.pdf
          git diff --cached --quiet || (git commit -m "docs(resume): refresh PT and EN PDFs" && git push)
